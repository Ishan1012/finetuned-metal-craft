name: CI/CD Pipeline - Docker Hub & AWS EC2 (t3.micro)

on:
  push:
    branches:
      - main
      - master
      - branch-ishan
  workflow_dispatch:

env:
  DOCKERHUB_REPO_BACKEND: asde-backend
  DOCKERHUB_REPO_FRONTEND: asde-frontend
  DOCKERHUB_REPO_ADMIN: asde-admin

jobs:
  # =========================================================================
  # JOB 1: Build Docker Images and Push to Docker Hub
  # =========================================================================
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # 1. Build & Push Backend Image
      # ---------------------------------------------------------------------
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_BACKEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # 2. Build & Push Frontend Image
      # ---------------------------------------------------------------------
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID || 'rzp_test_T0ZhE3atwRtK8R' }}
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.VITE_CLOUDINARY_CLOUD_NAME || 'daolnyz7s' }}
            VITE_CLOUDINARY_UPLOAD_PRESET=${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET || 'asde_uploads' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_FRONTEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # 3. Build & Push Admin Image
      # ---------------------------------------------------------------------
      - name: Build & Push Admin
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_SHOP_URL=/shop
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.VITE_CLOUDINARY_CLOUD_NAME || 'daolnyz7s' }}
            VITE_CLOUDINARY_UPLOAD_PRESET=${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET || 'asde_uploads' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_ADMIN }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_ADMIN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 2: Pull & Run on AWS EC2 (t3.micro)
  # =========================================================================
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (for docker-compose.yml transfer)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "~/app"

      - name: Deploy Containers on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "=== [1/6] Navigating to deployment directory ==="
            mkdir -p ~/app
            cd ~/app

            echo "=== [2/6] Setting environment variables for Docker Compose ==="
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

            # Log in to Docker Hub on EC2 (prevents rate limits / handles private repos)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "=== [3/6] Pulling latest Docker images from Docker Hub ==="
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_BACKEND }}:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_FRONTEND }}:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_ADMIN }}:latest

            echo "=== [4/6] Launching containers with Docker Compose ==="
            # Start or restart containers gracefully with resource limits
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" docker compose up -d --remove-orphans

            echo "=== [5/6] Cleaning up unused images to preserve t3.micro disk ==="
            docker image prune -af --filter "until=48h" || true

            echo "=== [6/6] Verifying Backend Healthcheck ==="
            sleep 10
            for i in {1..6}; do
              if curl -s -f http://localhost:5000/api/health > /dev/null; then
                echo "SUCCESS: Backend healthcheck passed!"
                exit 0
              fi
              echo "Waiting for backend to become healthy (attempt $i/6)..."
              sleep 5
            done

            echo "WARNING: Backend healthcheck timed out. Checking docker container logs:"
            docker logs asde-backend --tail 30
