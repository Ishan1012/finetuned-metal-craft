name: CI/CD Pipeline - Deploy Backend to AWS EC2 (t3.micro)

on:
  push:
    branches:
      - main
      - master
      - branch-ishan
  workflow_dispatch:

env:
  DOCKERHUB_REPO_BACKEND: asde-backend

jobs:
  # =========================================================================
  # JOB 1: Build & Push Backend Docker Image to Docker Hub
  # =========================================================================
  build-and-push:
    name: Build & Push Backend to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push only the backend image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_BACKEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 2: Pull & Run Backend on AWS EC2 (t3.micro)
  # =========================================================================
  deploy-to-ec2:
    name: Deploy Backend to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (for docker-compose.yml transfer)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "~/app"

      - name: Deploy Backend Container on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "=== [1/5] Navigating to app directory ==="
            mkdir -p ~/app
            cd ~/app

            echo "=== [2/5] Logging in to Docker Hub on EC2 ==="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "=== [3/5] Pulling latest backend image ==="
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO_BACKEND }}:latest

            echo "=== [4/5] Launching Backend container with Docker Compose ==="
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" docker compose up -d --remove-orphans

            echo "=== [5/5] Reclaiming disk space on t3.micro ==="
            docker image prune -af --filter "until=48h" || true

            echo "=== Verifying Backend Healthcheck ==="
            sleep 8
            for i in {1..6}; do
              if curl -s -f http://localhost:5000/api/health > /dev/null; then
                echo "SUCCESS: Backend is healthy and running on EC2!"
                exit 0
              fi
              echo "Waiting for backend to start (attempt $i/6)..."
              sleep 5
            done

            echo "WARNING: Healthcheck timed out. Checking backend container logs:"
            docker logs asde-backend --tail 40
