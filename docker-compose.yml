services:
  # ==========================================
  # Backend API Service (Node.js / Express)
  # ==========================================
  backend:
    image: ${DOCKERHUB_USERNAME}/asde-backend:latest
    container_name: asde-backend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
      - "80:5000"
    # Resource limits optimized for AWS EC2 t3.micro (1GB RAM)
    deploy:
      resources:
        limits:
          memory: 650M
        reservations:
          memory: 200M
